# Configuration for Motus with WAN Backbone and VLM Direct MoT
# Dobot cook_vegetable task, 16-dim (14->16 padded), global_downsample_rate=1
# No subtask/progress detection

common:
  # Robot dimensions (padded to 16 to align with pretrain checkpoint; pad positions excluded from loss)
  action_dim: 16         # 14-dim Dobot dual-arm padded to 16 (interleaved layout)
  state_dim: 16          # 14-dim Dobot dual-arm padded to 16
  max_action_dim: 16     # Triggers 14->16 padding + action_dim_is_pad loss mask in DobotDataset

  # Video settings (for WAN 5B)
  num_video_frames: 8    # Number of video frames
  video_height: 384      # Video frame height
  video_width: 320       # Video frame width

  # Sampling strategy parameters
  global_downsample_rate: 1      # No downsampling (30Hz native)
  video_action_freq_ratio: 2

# Dataset configuration
dataset:
  type: "dobot"            # Dobot dataset
  dataset_dir: "/cache/wx1513998/dobot/dobot_cook_vegetable_full"
  max_episodes: null
  image_aug: false

# Model configuration
model:
  # WAN Video Model settings
  wan:
    checkpoint_path: "/home/ma-user/work/wx1513998/pretrained_models/Wan2.2-TI2V-5B"
    vae_path: "/home/ma-user/work/wx1513998/pretrained_models/Wan2.2-TI2V-5B/Wan2.2_VAE.pth"
    config_path: "/home/ma-user/work/wx1513998/pretrained_models/Wan2.2-TI2V-5B"
    precision: "bfloat16"

  # VLM settings (Qwen3-VL-2B - trainable)
  vlm:
    checkpoint_path: "/home/ma-user/work/wx1513998/pretrained_models/Qwen3-VL-2B-Instruct"
    precision: "bfloat16"
    frozen: false             # VLM is trainable (not frozen)

  # Qwen3-VL Expert settings (per-layer QKV projections for direct MoT)
  qwen3_expert:
    vlm_dim: 2048             # Qwen3-VL-2B hidden size
    head_dim: 128             # Head dimension (matches WAN)
    num_heads: 24             # Number of heads (matches WAN 5B)
    num_layers: 30            # Number of layers (matches WAN)
    norm_eps: 1e-5

  # Action Expert configuration
  action_expert:
    hidden_size: 1024        # Hidden dimension (same as original Motus)
    ffn_dim_multiplier: 4    # FFN = hidden_size * multiplier
    norm_eps: 1e-5

  # Time distribution settings
  time_distribution:
    timestep_sample_method: "logit_normal"
    sigmoid_scale: 1.0
    min_t: 0.0
    max_t: 1.0

  # Training mode
  training_mode: "finetune"   # "pretrain" (action only) or "finetune" (state+action)

  # Inference settings
  inference:
    num_inference_timesteps: 10

  # Loss weights
  loss_weights:
    video_loss_weight: 1.0
    action_loss_weight: 1.0

  # EMA settings
  ema:
    enabled: false
    update_after_step: 0
    inv_gamma: 1.0
    power: 0.75
    min_value: 0.0
    max_value: 0.9999

# Training configuration
training:
  batch_size: 10
  max_steps: 100000
  learning_rate: 5.0e-5
  wan_learning_rate: 5.0e-5      # WAN backbone LR
  vlm_learning_rate: 5.0e-5       # VLM LR
  weight_decay: 0.01
  gradient_accumulation_steps: 1  # Effective batch size = batch_size * gradient_accumulation_steps * num_gpus

  scheduler_type: "linear"
  warmup_steps: 200
  cycle_length: 5000000
  f_max: 0.99
  f_min: 0.4

  grad_clip_norm: 0.5
  use_amp: true
  find_unused_parameters: false

# System settings
system:
  checkpoint_dir: "/cache/wwx1484778/motus/checkpoints_wan_vlm_mask_dobot_cook_dim16"
  log_level: "INFO"

  log_interval: 50
  save_interval: 20000
  val_interval: 500

  num_workers: 16
  pin_memory: true

# Logging settings
logging:
  report_to: "tensorboard"
  tensorboard_log_dir: "/cache/wwx1484778/motus/tensorboard_wan_vlm_mask_dobot_cook_dim16"
  run_name: null

# Resume training settings
resume:
  checkpoint_path: null

# Finetune settings
finetune:
  checkpoint_path: "/cache/wwx1484778/motus/train_log/0512/checkpoints_wan_vlm_mask_0618_pretrain_16dim_Robotwin/robotwin_wan_vlm_mask_stage2_15w_dim16/motus_wan_vlm_robotwin_dim16_bs8_lr5e-05/checkpoint_step_80000/pytorch_model"  # 16-dim pretrain weights
